models:
  - name: stg_trips
    columns:
      - name: pickup_at
        data_tests:
          - not_null
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
      - name: pickup_zone_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_zones')
                field: zone_id
  - name: stg_zones
    columns:
      - name: zone_id
        data_tests:
          - unique
          - not_null